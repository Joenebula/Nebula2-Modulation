name: Build VST3

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, e.g. v0.2.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Configure (Mac, Intel + Apple Silicon)
        if: runner.os == 'macOS'
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --target Nebula2Modulation_VST3 EngineTest

      - name: Test rack engine (Windows)
        if: runner.os == 'Windows'
        run: build\Release\EngineTest.exe

      - name: Test rack engine (Mac)
        if: runner.os == 'macOS'
        run: build/Release/EngineTest

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/Nebula2Modulation_artefacts/Release/VST3/Nebula2 Modulation.vst3" -DestinationPath "dist/Nebula2-Modulation-Windows-VST3.zip"

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cd build/Nebula2Modulation_artefacts/Release/VST3
          codesign --force --deep -s - "Nebula2 Modulation.vst3"
          ditto -c -k --keepParent "Nebula2 Modulation.vst3" "$GITHUB_WORKSPACE/dist/Nebula2-Modulation-Mac-VST3.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula2-Modulation-${{ matrix.name }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Nebula2 Modulation ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
